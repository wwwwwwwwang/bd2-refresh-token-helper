name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试、检查并构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v6

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 校验 Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: 设置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 测试、Lint 并构建 Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: 上传 Debug APK 与检查报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: bd2-refresh-token-helper-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7
