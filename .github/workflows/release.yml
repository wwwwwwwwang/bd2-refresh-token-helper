name: 发布正式 APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 测试、签名并发布 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v6

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 校验 Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: 设置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 校验版本与签名配置
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD \
            ANDROID_RELEASE_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name 未配置"
              exit 1
            fi
          done

          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "::error::Tag 版本 $tag_version 与 App 版本 $app_version 不一致"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: 准备正式签名
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bd2-release.keystore"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/bd2-release.keystore" >> "$GITHUB_ENV"

      - name: 测试、Lint 并构建正式 APK
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease --stacktrace

      - name: 整理发布文件
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.metadata.outputs.version }}"
          mkdir -p release
          apk="release/bd2-refresh-token-helper-v${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          (
            cd release
            sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256"
          )

      - name: 上传正式构建产物
        uses: actions/upload-artifact@v5
        with:
          name: bd2-refresh-token-helper-v${{ steps.metadata.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "BD2 Refresh Token 获取助手 $GITHUB_REF_NAME" \
            --generate-notes

      - name: 清理正式签名
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/bd2-release.keystore"
